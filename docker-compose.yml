services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-widoroku}
      POSTGRES_USER: ${POSTGRES_USER:-widoroku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-widoroku-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-widoroku} -d ${POSTGRES_DB:-widoroku}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-widoroku}:${POSTGRES_PASSWORD:-widoroku-dev-password}@db:5432/${POSTGRES_DB:-widoroku}?sslmode=disable
      API_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  postgres_data:
